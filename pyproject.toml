[project]
name = "entirius-django-accounts-export-to-magento-api"
version = "2.0.0"
description = "Customer account export from Entirius to a Magento 2 store over the Magento REST API, in bulk requests"
keywords = ["django", "magento", "magento2", "customers", "account-export", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "celery>=5.4",
    "celery-once>=3.0.1",
    "django-allauth>=0.45.0",
    "marshmallow>=3.19",
    "marshmallow-dataclass>=8.5",
    "tqdm",
    "entirius-django-accounts>=5.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-magento2-sdk2>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    # django_accounts URLconf pulls verify_captcha (lazy django_captcha import in django_utils);
    # tests boot with django_captcha in INSTALLED_APPS, mirroring entirius-django-accounts' own tests.
    "entirius-django-captcha>=2.0.0",
]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-accounts-export-to-magento-api/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-accounts-export-to-magento-api"
Changelog = "https://github.com/entirius/entirius-django-accounts-export-to-magento-api/releases"
Issues = "https://github.com/entirius/entirius-django-accounts-export-to-magento-api/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_accounts_export_to_magento_api"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_accounts_export_to_magento_api/domain/export_accounts.py" = ["B007"]
"src/django_accounts_export_to_magento_api/models.py" = ["DJ008"]
"src/django_accounts_export_to_magento_api/tasks.py" = ["F841"]
"src/django_accounts_export_to_magento_api/utils/params.py" = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["django_accounts_export_to_magento_api"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
